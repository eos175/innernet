[workspace]

[package]
name = "innernet-desktop"
version = "2.0.0"
description = "Desktop client for innernet mesh VPN"
authors = ["Tonari & Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5", features = ["tray-icon"] }
tokio = { version = "1.28", features = ["full"] }
